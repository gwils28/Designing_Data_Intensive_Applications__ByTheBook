# Lab du chapitre Cohérence et consensus : une grappe etcd de 3 nœuds (Raft).
#
#   docker compose -f docker/consistency/compose.yml -p ddia_consistency up -d
#   docker compose -f docker/consistency/compose.yml -p ddia_consistency down -v
#
# Ports hôtes : 11001, 11002, 11003 -> API client (2379) de etcd1, etcd2, etcd3
# (passerelle JSON/HTTP : http://127.0.0.1:11001/v3/kv/range, etc.).
name: ddia_consistency

x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.17
  environment:
    ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
    ETCD_INITIAL_CLUSTER_STATE: new
    ETCD_INITIAL_CLUSTER_TOKEN: ddia-ch10
    ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    ETCD_DATA_DIR: /etcd-data
    # battement toutes les 100 ms, délai d'élection 1 s (valeurs par défaut d'etcd)
    ETCD_HEARTBEAT_INTERVAL: "100"
    ETCD_ELECTION_TIMEOUT: "1000"

services:
  etcd1:
    <<: *etcd
    container_name: ddia_consistency_etcd1
    command: ["etcd", "--name", "etcd1", "--advertise-client-urls", "http://etcd1:2379",
              "--initial-advertise-peer-urls", "http://etcd1:2380"]
    ports: ["11001:2379"]
  etcd2:
    <<: *etcd
    container_name: ddia_consistency_etcd2
    command: ["etcd", "--name", "etcd2", "--advertise-client-urls", "http://etcd2:2379",
              "--initial-advertise-peer-urls", "http://etcd2:2380"]
    ports: ["11002:2379"]
  etcd3:
    <<: *etcd
    container_name: ddia_consistency_etcd3
    command: ["etcd", "--name", "etcd3", "--advertise-client-urls", "http://etcd3:2379",
              "--initial-advertise-peer-urls", "http://etcd3:2380"]
    ports: ["11003:2379"]
