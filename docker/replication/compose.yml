# Lab du chapitre Replication : un primaire PostgreSQL et deux répliques en streaming.
#
#   docker compose -f docker/replication/compose.yml -p ddia_replication up -d
#   docker compose -f docker/replication/compose.yml -p ddia_replication down -v
#
# Ports hôtes : primaire 10632, replica1 10633, replica2 10634 (utilisateur, mot de passe,
# base : ddia). Le lab modifie la topologie (basculement) : repartir de zéro avec down -v.
name: ddia_replication
services:
  primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ddia
      POSTGRES_PASSWORD: ddia
      POSTGRES_DB: ddia
    # wal_level=logical : nécessaire au décodage logique (test_decoding)
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10",
              "-c", "max_replication_slots=10", "-c", "wal_keep_size=256MB"]
    volumes:
      - ./init-primary.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    ports:
      - "10632:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddia -d ddia"]
      interval: 2s
      timeout: 3s
      retries: 30
  replica1:
    image: postgres:16-alpine
    environment:
      REPLICA_NAME: replica1
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    volumes:
      - ./replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      primary:
        condition: service_healthy
    ports:
      - "10633:5432"
  replica2:
    image: postgres:16-alpine
    environment:
      REPLICA_NAME: replica2
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    volumes:
      - ./replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      primary:
        condition: service_healthy
    ports:
      - "10634:5432"
